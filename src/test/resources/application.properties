spring.application.name=jersey-see

spring.datasource.url=${JERSEYSEE_DB_URL}
spring.datasource.username=${JERSEYSEE_DB_USERNAME}
spring.datasource.password=${JERSEYSEE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.address=0.0.0.0
server.port=${PORT:8080}

app.demo-data.enabled=false
app.upload.dir=${APP_UPLOAD_DIR:/tmp/jerseysee-uploads}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB