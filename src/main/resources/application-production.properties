# Explicit non-demo deployment profile. All three values are required.
spring.datasource.url=${JERSEYSEE_DB_URL}
spring.datasource.username=${JERSEYSEE_DB_USERNAME}
spring.datasource.password=${JERSEYSEE_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.address=0.0.0.0
server.port=${PORT:8080}

# Keep the Render Free cold-start path lightweight. Beans are created when first
# needed, Hikari does not block startup waiting for Aiven, and Hibernate boots
# from explicit MySQL metadata instead of opening a JDBC metadata connection.
spring.main.lazy-initialization=true
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.minimum-idle=0

# Production is always MySQL. Hibernate never mutates the schema. Flyway owns
# deliberate versioned changes and baselines the already-existing schema at V1
# before applying the persistent-cart V2 migration.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.jakarta.persistence.database-product-name=MySQL
spring.jpa.properties.jakarta.persistence.database-major-version=8
spring.jpa.properties.jakarta.persistence.database-minor-version=4
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.demo-data.enabled=false
app.demo-data.adopt-legacy=false
app.demo-catalog.enabled=${JERSEYSEE_DEMO_CATALOG_ENABLED:false}
# The production database has already been bootstrapped. Keep demo reseeding off
# so customer profiles and staff edits to products, prices, stock, status and
# images remain authoritative across Render restarts. It can be enabled
# explicitly only when intentionally bootstrapping a brand-new database.
app.public-demo.enabled=${JERSEYSEE_PUBLIC_DEMO_ENABLED:false}
app.seed-admin.enabled=${APP_SEED_ADMIN_ENABLED:false}
app.seed-admin.email=${APP_SEED_ADMIN_EMAIL:}
app.seed-admin.password=${APP_SEED_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
# Process readiness must not wait for a transatlantic database round trip. Real
# catalog/auth smoke checks still verify database-backed behavior after deploy.
management.health.db.enabled=false
