# Render-native PostgreSQL recovery profile.
# Activate after production so these values override the legacy Aiven/MySQL
# datasource while preserving all production-only security and storage beans.
spring.datasource.url=${JERSEYSEE_POSTGRES_URL}
spring.datasource.username=${JERSEYSEE_POSTGRES_USERNAME}
spring.datasource.password=${JERSEYSEE_POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# This recovery database starts empty. Hibernate creates/updates the schema from
# the JPA model; the existing Flyway V2 migration is MySQL-specific.
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=true
spring.jpa.properties.jakarta.persistence.database-product-name=PostgreSQL
spring.jpa.properties.jakarta.persistence.database-major-version=16
spring.jpa.properties.jakarta.persistence.database-minor-version=0

# A deployment must fail quickly when its database is unavailable instead of
# reporting process health while every real page returns a transaction error.
spring.main.lazy-initialization=false
spring.datasource.hikari.initialization-fail-timeout=1
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
management.health.db.enabled=true
