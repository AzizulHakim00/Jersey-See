spring.application.name=jersey-see
spring.profiles.default=intellij
server.address=0.0.0.0
server.port=${PORT:8080}
server.compression.enabled=true
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/jerseysee?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
app.demo-data.enabled=false
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JWT uses a random per-process key locally when unset. Production requires a stable secret.
app.jwt.secret-base64=${JWT_SECRET_BASE64:}
app.auth.secure-cookies=${AUTH_SECURE_COOKIES:false}
# Opt in to persistent Cloudinary photo uploads. Existing SQL/local images remain readable.
app.images.storage=${IMAGE_STORAGE:legacy}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
