<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="title desc">
  <title id="title">JerseySee footballer illustration</title>
  <desc id="desc">A brand-neutral football player seen from behind in a premium navy kit under stadium lights.</desc>
