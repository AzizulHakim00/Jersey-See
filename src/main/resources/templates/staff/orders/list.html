<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Order operations | JerseySee</title><link rel="stylesheet" th:href="@{/css/jerseysee.css}"></head>
<body class="staff-body"><div th:replace="~{fragments/admin-sidebar :: sidebar('orders')}"></div><main class="staff-main"><div class="staff-content"><div th:replace="~{fragments/messages :: messages}"></div>
<header class="page-header"><div><span class="eyebrow">Fulfilment</span><h1>Order operations</h1><p>Inspect customer orders and open the workflow record for authorised transitions.</p></div><label class="table-search">Search<input type="search" placeholder="Order, customer or status" data-table-search="ordersTable"></label></header>
<section class="panel table-panel"><div class="panel-header"><div><h2>All orders</h2><p><span th:text="${#lists.size(orders)}">0</span> records</p></div></div><div class="empty-state compact" th:if="${orders == null or #lists.isEmpty(orders)}"><span>◎</span><h3>No orders in the queue</h3></div><div class="table-wrap" th:if="${orders != null and !#lists.isEmpty(orders)}"><table class="data-table" id="ordersTable"><thead><tr><th>Order</th><th>Customer</th><th>Placed</th><th>Payment</th><th>Status</th><th>Total</th><th></th></tr></thead><tbody><tr th:each="order : ${orders}"><td><strong>#<span th:text="${order.id}">0</span></strong><small><span th:text="${#lists.size(order.items)}">0</span> line(s)</small></td><td><strong th:text="${order.customer.name}">Customer</strong><small th:text="${order.customer.email}">Email</small></td><td th:text="${order.createdAt != null ? #temporals.format(order.createdAt,'dd MMM yyyy') : '—'}">Date</td><td><span class="status-badge" th:text="${order.payment != null ? order.payment.status : 'N/A'}">PENDING</span></td><td><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status}">PENDING</span></td><td><strong>৳<span th:text="${#numbers.formatDecimal(order.total,1,2)}">0.00</span></strong></td><td><a class="button button-ghost button-small" th:href="@{/staff/orders/{id}(id=${order.id})}">Open</a></td></tr></tbody></table></div></section>
</div></main><script th:src="@{/js/app.js}" defer></script></body></html>
