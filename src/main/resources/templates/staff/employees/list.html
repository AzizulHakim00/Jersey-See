<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Team directory | JerseySee</title>
    <link rel="stylesheet" th:href="@{/css/jerseysee.css}">
</head>
<body class="staff-body">
<div th:replace="~{fragments/admin-sidebar :: sidebar('employees')}"></div>
<main class="staff-main"><div class="staff-content"><div th:replace="~{fragments/messages :: messages}"></div>
<header class="page-header"><div><span class="eyebrow">People operations</span><h1>Team directory</h1><p>Create, update, enable or disable operational accounts from one protected view.</p></div><div class="header-actions"><label class="table-search">Search<input type="search" placeholder="Name, code, role or position" data-table-search="employeesTable"></label><a class="button button-lime" th:href="@{/staff/employees/new}">Create staff account</a></div></header>
<section class="panel table-panel">
    <div class="empty-state compact" th:if="${employees == null or #lists.isEmpty(employees)}"><span>TEAM</span><h3>No staff profiles yet</h3></div>
    <div class="table-wrap" th:if="${employees != null and !#lists.isEmpty(employees)}">
        <table class="data-table" id="employeesTable">
            <thead><tr><th>Employee</th><th>Code</th><th>Role</th><th>Position</th><th>Joined</th><th>Salary</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>
            <tr th:each="employee : ${employees}">
                <td><div class="person-cell"><span class="avatar" th:text="${#strings.substring(employee.user.name,0,1)}">A</span><span><strong th:text="${employee.user.name}">Name</strong><small th:text="${employee.user.email}">Email</small></span></div></td>
                <td th:text="${employee.employeeCode}">EMP-1</td>
                <td><span class="role-badge" th:text="${employee.user.role}">SALESMAN</span></td>
                <td th:text="${employee.position}">Position</td>
                <td th:text="${#temporals.format(employee.joiningDate,'dd MMM yyyy')}">Date</td>
                <td>৳<span th:text="${#numbers.formatDecimal(employee.salary,1,2)}">0.00</span></td>
                <td><span class="status-badge" th:classappend="${employee.active and employee.user.enabled ? ' status-active' : ' status-cancelled'}" th:text="${employee.active and employee.user.enabled ? 'ACTIVE' : 'INACTIVE'}">ACTIVE</span></td>
                <td>
                    <div class="header-actions" th:if="${currentRole != null and (currentRole.name() == 'ADMIN' or employee.user.role.name() == 'SALESMAN' or employee.user.role.name() == 'CASHIER')}">
                        <a class="button button-ghost" th:href="@{/staff/employees/{id}/edit(id=${employee.id})}">Edit</a>
                        <form th:if="${currentUser == null or currentUser.email != employee.user.email}" th:action="@{/staff/employees/{id}/status(id=${employee.id})}" method="post">
                            <input type="hidden" name="active" th:value="${!(employee.active and employee.user.enabled)}">
                            <button class="button button-ghost" type="submit" th:text="${employee.active and employee.user.enabled ? 'Disable' : 'Enable'}">Disable</button>
                        </form>
                        <form th:if="${currentRole.name() == 'ADMIN' and (currentUser == null or currentUser.email != employee.user.email)}" th:action="@{/staff/employees/{id}/delete(id=${employee.id})}" method="post" onsubmit="return confirm('Remove this staff account permanently?');">
                            <button class="button button-danger" type="submit">Remove</button>
                        </form>
                    </div>
                    <span th:unless="${currentRole != null and (currentRole.name() == 'ADMIN' or employee.user.role.name() == 'SALESMAN' or employee.user.role.name() == 'CASHIER')}">Protected</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</div></main>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
