<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payment desk | JerseySee</title><link rel="stylesheet" th:href="@{/css/jerseysee.css}"></head>
<body class="staff-body"><div th:replace="~{fragments/admin-sidebar :: sidebar('payments')}"></div><main class="staff-main"><div class="staff-content"><div th:replace="~{fragments/messages :: messages}"></div>
<header class="page-header"><div><span class="eyebrow">Cash control</span><h1>Payment desk</h1><p>Review simulated payments. Only cashiers and administrators can confirm pending records.</p></div><label class="table-search">Search<input type="search" placeholder="Order, method or reference" data-table-search="paymentsTable"></label></header>
<div th:object="${confirmation}"><div class="global-errors" th:if="${#fields.hasGlobalErrors()}"><p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Payment error</p></div></div>
<section class="panel table-panel" th:object="${confirmation}"><div class="empty-state compact" th:if="${payments == null or #lists.isEmpty(payments)}"><span>৳</span><h3>No payments recorded</h3></div><div class="table-wrap" th:if="${payments != null and !#lists.isEmpty(payments)}"><table class="data-table" id="paymentsTable"><thead><tr><th>Payment</th><th>Order / customer</th><th>Method</th><th>Reference</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="payment : ${payments}"><td><strong>#<span th:text="${payment.id}">0</span></strong><small th:text="${payment.paymentDate != null ? #temporals.format(payment.paymentDate,'dd MMM yyyy HH:mm') : 'Not paid'}">Date</small></td><td><strong>#<span th:text="${payment.customerOrder.id}">0</span> · <span th:text="${payment.customerOrder.customer.name}">Customer</span></strong><small th:text="${payment.customerOrder.customer.email}">Email</small></td><td th:text="${#strings.replace(payment.method.name(),'_',' ')}">Method</td><td th:text="${payment.transactionId != null ? payment.transactionId : '—'}">—</td><td><strong>৳<span th:text="${#numbers.formatDecimal(payment.amount,1,2)}">0.00</span></strong></td><td><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(payment.status.name())}" th:text="${payment.status}">PENDING</span></td><td><form th:if="${payment.status.name() == 'PENDING' and (currentRole.name() == 'CASHIER' or currentRole.name() == 'ADMIN')}" th:action="@{/staff/payments/{id}/confirm(id=${payment.id})}" method="post" data-confirm="Confirm this simulated payment?"><label class="sr-only" th:for="${'txn-' + payment.id}">Transaction ID</label><input class="table-input" th:id="${'txn-' + payment.id}" name="transactionId" type="text" maxlength="100" th:value="${payment.transactionId}" placeholder="Transaction ID"><span class="field-error" th:if="${#fields.hasErrors('transactionId')}" th:errors="*{transactionId}">Error</span><button class="button button-lime button-small" type="submit">Confirm</button></form><span th:if="${payment.status.name() == 'PENDING' and currentRole.name() == 'MANAGER'}">Review only</span><span th:if="${payment.status.name() != 'PENDING'}">Complete</span></td></tr></tbody></table></div></section>
</div></main><script th:src="@{/js/app.js}" defer></script></body></html>
