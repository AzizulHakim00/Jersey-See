<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Product control | JerseySee</title><link rel="stylesheet" th:href="@{/css/jerseysee.css}"></head>
<body class="staff-body"><div th:replace="~{fragments/admin-sidebar :: sidebar('products')}"></div><main class="staff-main"><div class="staff-content"><div th:replace="~{fragments/messages :: messages}"></div>
<header class="page-header"><div><span class="eyebrow">Catalog management</span><h1>Product control</h1><p>Manage product content, images and size-level inventory.</p></div><div class="header-actions"><label class="table-search">Search<input type="search" placeholder="Product, brand or club" data-table-search="productsTable"></label><a class="button button-lime" th:href="@{/staff/products/new}">New product</a></div></header>
<section class="panel table-panel"><div class="empty-state compact" th:if="${products == null or products.empty}"><span>KIT</span><h3>No products yet</h3><a class="button button-blue" th:href="@{/staff/products/new}">Create the first product</a></div><div class="table-wrap" th:if="${products != null and !products.empty}"><table class="data-table" id="productsTable"><thead><tr><th>Product</th><th>Category</th><th>Type</th><th>Base price</th><th>Variants</th><th>Visibility</th><th>Action</th></tr></thead><tbody><tr th:each="product : ${products.content}"><td><div class="product-table-cell"><img th:src="${product.storedImageName != null ? '/product-images/' + product.storedImageName : '/images/product-placeholder.svg'}" alt="" onerror="this.onerror=null;this.src='/images/product-placeholder.svg'"><span><strong th:text="${product.name}">Product</strong><small><span th:text="${product.brand}">Brand</span> · <span th:text="${product.clubOrCountry != null ? product.clubOrCountry : 'General'}">Club</span></small></span></div></td><td th:text="${product.category.name}">Category</td><td th:text="${product.productType}">JERSEY</td><td>৳<span th:text="${#numbers.formatDecimal(product.basePrice,1,2)}">0.00</span></td><td th:text="${#lists.size(product.variants)}">0</td><td><span class="status-badge" th:classappend="${product.active ? ' status-active' : ' status-cancelled'}" th:text="${product.active ? 'ACTIVE' : 'HIDDEN'}">ACTIVE</span></td><td><a class="button button-ghost button-small" th:href="@{/staff/products/{id}/edit(id=${product.id})}">Edit</a></td></tr></tbody></table></div><nav class="pagination" th:if="${products != null and products.totalPages > 1}"><a th:if="${products.hasPrevious()}" th:href="@{/staff/products(page=${products.number - 1})}">← Previous</a><span>Page <b th:text="${products.number + 1}">1</b> of <b th:text="${products.totalPages}">1</b></span><a th:if="${products.hasNext()}" th:href="@{/staff/products(page=${products.number + 1})}">Next →</a></nav></section>
</div></main><script th:src="@{/js/app.js}" defer></script></body></html>
