<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your orders | JerseySee</title><link rel="stylesheet" th:href="@{/css/jerseysee.css}"></head>
<body><div th:replace="~{fragments/navigation :: navigation('orders')}"></div><main class="page-main"><div class="section-shell"><div th:replace="~{fragments/messages :: messages}"></div>
<header class="page-header"><div><span class="eyebrow">Order history</span><h1>Your orders</h1><p>Track status, totals, payment and downloadable invoices.</p></div><a class="button button-lime" th:href="@{/catalog}">Shop again</a></header>
<section class="empty-state" th:if="${orders == null or #lists.isEmpty(orders)}"><span>◎</span><h2>No orders yet</h2><p>Your first match-day order will appear here.</p><a class="button button-blue" th:href="@{/catalog}">Browse catalog</a></section>
<section class="order-card-list" th:if="${orders != null and !#lists.isEmpty(orders)}"><article class="order-card" th:each="order : ${orders}"><div class="order-card-main"><span class="status-badge" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status}">PENDING</span><h2>Order #<span th:text="${order.id}">0</span></h2><p th:if="${order.createdAt != null}" th:text="${#temporals.format(order.createdAt,'dd MMMM yyyy · HH:mm')}">Date</p></div><div><small>Items</small><strong th:text="${#lists.size(order.items)}">0</strong></div><div><small>Payment</small><strong th:text="${order.payment != null ? order.payment.status : 'UNAVAILABLE'}">PENDING</strong></div><div><small>Total</small><strong>৳<span th:text="${#numbers.formatDecimal(order.total,1,2)}">0.00</span></strong></div><a class="button button-ghost button-small" th:href="@{/orders/{id}(id=${order.id})}">View order</a></article></section>
</div></main><script th:src="@{/js/app.js}" defer></script></body></html>
