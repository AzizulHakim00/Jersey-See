<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${'Order #' + order.id + ' | JerseySee'}">Order | JerseySee</title><link rel="stylesheet" th:href="@{/css/jerseysee.css}"></head>
<body class="storefront-body">
<div th:replace="~{fragments/navigation :: navigation('orders')}"></div>
<main class="page-main account-page" data-order-detail><div class="section-shell narrow-shell">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{/}">Home</a><span>/</span><a th:href="@{/orders}">Orders</a><span>/</span><span>Order <b th:text="${'#' + order.id}">#1</b></span></nav>
    <div th:replace="~{fragments/messages :: messages}"></div>
    <header class="order-detail-header premium-order-detail-header"><div><span class="eyebrow">Order record</span><h1>Order #<span th:text="${order.id}">31</span></h1><p th:if="${order.createdAt != null}" th:text="${#temporals.format(order.createdAt,'dd MMMM yyyy · HH:mm')}">Date</p></div><span class="status-badge large" th:classappend="${' status-' + #strings.toLowerCase(order.status.name())}" th:text="${order.status}">PENDING</span></header>
    <section class="detail-panels premium-order-panels">
        <article class="panel order-items-panel">
            <div class="panel-header"><div><span class="eyebrow">Your selection</span><h2>Order items</h2></div></div>
            <div class="order-item premium-order-item" th:each="item : ${order.items}"><span class="order-item-number" th:text="${item.quantity}">1</span><div><strong th:text="${item.productName}">Product</strong><small><span th:text="${item.sku}">SKU</span> · Size <span th:text="${item.size}">M</span> · Qty <span th:text="${item.quantity}">1</span></small><small th:if="${item.printingType.name() != 'NONE'}">Print: <span th:text="${item.customName}">NAME</span> <span th:text="${item.customNumber}">10</span> (<span th:text="${item.printingType}">CUSTOM</span>)</small></div><b>৳<span th:text="${#numbers.formatDecimal(item.subtotal,1,2)}">0.00</span></b></div>
            <dl class="totals-list"><div><dt>Subtotal</dt><dd>৳<span th:text="${#numbers.formatDecimal(order.subtotal,1,2)}">0.00</span></dd></div><div><dt>Delivery</dt><dd>৳<span th:text="${#numbers.formatDecimal(order.deliveryFee,1,2)}">0.00</span></dd></div><div><dt>Total</dt><dd>৳<span th:text="${#numbers.formatDecimal(order.total,1,2)}">0.00</span></dd></div></dl>
        </article>
        <aside>
            <article class="panel info-panel"><span class="eyebrow">Delivery</span><h2 th:text="${order.deliveryRecipientName}">Recipient</h2><p th:text="${order.deliveryPhone}">Phone</p><address th:text="${order.deliveryAddress}">Address</address></article>
            <article class="panel info-panel" th:if="${order.payment != null}"><span class="eyebrow">Payment</span><h2 th:text="${#strings.replace(order.payment.method.name(),'_',' ')}">Method</h2><p>Status: <strong th:text="${order.payment.status}">PENDING</strong></p><p th:if="${order.payment.transactionId != null}">Transaction: <strong th:text="${order.payment.transactionId}">TXN</strong></p></article>
            <a class="button button-ink button-wide" th:href="@{/orders/{id}/invoice(id=${order.id})}">Download invoice</a>
            <form th:if="${currentRole != null and currentRole.name() == 'CUSTOMER' and (order.status.name() == 'PENDING' or order.status.name() == 'CONFIRMED')}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" data-confirm="Cancel this order and restore its stock?"><button class="button button-danger button-wide" type="submit">Cancel order</button></form>
        </aside>
    </section>
</div></main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/app.js}" defer></script>
</body></html>
