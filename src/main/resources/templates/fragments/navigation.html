<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="store-header" th:fragment="navigation(activePage)" data-storefront-header>
    <div class="store-nav section-shell">
        <button class="menu-toggle modern-menu-toggle" type="button" data-menu-toggle data-mobile-menu-toggle
                aria-controls="mobileMenu" aria-expanded="false" aria-label="Open navigation">
            <span></span><span></span><span></span>
        </button>

        <a class="brand modern-brand" th:href="@{/}" aria-label="JerseySee home">
            <img th:src="@{/images/brand-mark.svg}" alt="" width="39" height="44">
            <span><strong>JerseySee</strong><small>Football store</small></span>
        </a>

        <nav class="primary-shop-nav" id="mobileMenu" data-primary-shop-nav data-mobile-menu aria-label="Primary navigation">
            <div class="primary-shop-links">
                <a th:href="@{/}" th:classappend="${activePage == 'home'} ? ' is-active' : ''">Home</a>
                <a th:href="@{/catalog}" th:classappend="${activePage == 'catalog'} ? ' is-active' : ''">Shop</a>
                <a th:href="@{/catalog(edition='PLAYER')}">Player edition</a>
                <a th:href="@{/catalog(edition='RETRO')}">Retro</a>
                <a th:href="@{/catalog(productType='BOOTS')}">BOOTS</a>
            </div>

            <div class="mobile-account-links" th:if="${currentUser != null}">
                <span class="mobile-account-title">Your account</span>
                <a th:href="@{/dashboard}">Dashboard</a>
                <a th:href="@{/profile}">Profile</a>
                <a th:if="${currentRole != null and currentRole.name() == 'CUSTOMER'}" th:href="@{/orders}">Orders</a>
            </div>

            <form class="mobile-nav-logout" th:if="${currentUser != null}"
                  th:action="@{/logout}" method="post" data-logout-form>
                <button type="submit">Log out</button>
            </form>
        </nav>

        <div class="nav-actions modern-nav-actions">
            <form class="header-search modern-header-search" th:action="@{/catalog}" method="get" role="search">
                <label class="sr-only" for="headerSearch">Search the store</label>
                <input id="headerSearch" name="keyword" type="search" placeholder="Search shirts, clubs &amp; gear" autocomplete="off">
                <button type="submit" aria-label="Search">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
                </button>
            </form>

            <a class="nav-icon-link" th:if="${currentUser == null}" th:href="@{/login}" aria-label="Sign in">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c.5-5 3-7.5 7.5-7.5S19 16 19.5 21"></path></svg>
                <span>Sign in</span>
            </a>
            <a class="nav-icon-link" th:if="${currentUser != null and currentRole != null and currentRole.name() == 'CUSTOMER'}"
               th:href="@{/dashboard}" aria-label="Open account">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c.5-5 3-7.5 7.5-7.5S19 16 19.5 21"></path></svg>
                <span>Account</span>
            </a>
            <a class="nav-icon-link" th:if="${currentUser != null and currentRole != null and currentRole.name() != 'CUSTOMER'}"
               th:href="@{/dashboard}" aria-label="Open dashboard">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v5h-7zM13 11h7v9h-7zM4 13h7v7H4z"></path></svg>
                <span>Dashboard</span>
            </a>

            <a class="nav-icon-link bag-link" th:if="${currentRole != null and currentRole.name() == 'CUSTOMER'}" th:href="@{/cart}" aria-label="Shopping bag">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg>
                <span>Bag</span><strong th:text="${cartCount}">0</strong>
            </a>
            <a class="nav-icon-link bag-link" th:if="${currentUser == null}" th:href="@{/login}" aria-label="Sign in to use shopping bag">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></svg>
                <span>Bag</span>
            </a>

            <form class="header-logout modern-header-logout" th:if="${currentUser != null}" th:action="@{/logout}" method="post" data-logout-form>
                <button type="submit" aria-label="Log out">Log out</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/navigation :: logoutModal}"></div>
</header>

<div class="confirm-modal" th:fragment="logoutModal" data-logout-modal hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="logoutTitle">
        <span class="modal-mark" aria-hidden="true">JS</span>
        <h2 id="logoutTitle">Sign out of JerseySee?</h2>
        <p>Your current session will end. You can sign back in at any time.</p>
        <div class="modal-actions">
            <button class="button button-ghost" type="button" data-close-modal>Stay signed in</button>
            <form th:action="@{/logout}" method="post">
                <button class="button button-danger" type="submit">Log out</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
