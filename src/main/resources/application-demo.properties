# Explicit local-only demo profile: ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=${DEMO_DB_URL:jdbc:h2:mem:jerseysee_demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
app.upload.dir=${APP_UPLOAD_DIR:demo-uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Demo users are supplied solely by DemoDataInitializer; no external credentials are read.
app.demo-data.enabled=true
app.seed-admin.enabled=false
