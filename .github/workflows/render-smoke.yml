name: Render deployment diagnostics

on:
  push:
    branches:
      - ops/render-deployment-smoke

jobs:
  inspect-render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect live catalog and demo access
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://jersey-see.onrender.com"

          curl -fsS --retry 3 --retry-delay 2 --max-time 35 "${base_url}/actuator/health"
          echo

          curl -fsS --retry 3 --retry-delay 2 --max-time 35 "${base_url}/catalog" -o /tmp/catalog.html
          echo "Catalog bytes: $(wc -c < /tmp/catalog.html)"
          count="$(grep -oE '<strong>[0-9]+</strong><span>pieces in the collection</span>' /tmp/catalog.html | sed -E 's#<strong>([0-9]+)</strong>.*#\1#' | head -n1 || true)"
          echo "Rendered collection count: ${count:-unknown}"
          echo 'Rendered product names:'
          grep -oE '<h3><a href="/products/[0-9]+">[^<]+' /tmp/catalog.html | sed -E 's#.*>##' | head -n 30 || true
          echo 'Rendered image paths:'
          grep -oE '/product-images/[^\" ]+' /tmp/catalog.html | head -n 10 || true
          echo 'Empty-state marker:'
          grep -F 'No products match this edit.' /tmp/catalog.html || true

          curl -fsS --retry 3 --retry-delay 2 --max-time 35 -c /tmp/cookies.txt "${base_url}/login" -o /tmp/login.html
          csrf="$(sed -nE 's/.*name="_csrf"[^>]*value="([^"]+)".*/\1/p' /tmp/login.html | head -n1 || true)"
          if [[ -z "$csrf" ]]; then
            csrf="$(sed -nE 's/.*value="([^"]+)"[^>]*name="_csrf".*/\1/p' /tmp/login.html | head -n1 || true)"
          fi
          echo "CSRF token present: $([[ -n "$csrf" ]] && echo yes || echo no)"
          [[ -n "$csrf" ]] || exit 1

          code="$(curl -sS --max-time 35 -b /tmp/cookies.txt -c /tmp/cookies.txt -D /tmp/demo-headers.txt -o /tmp/demo-body.txt -w '%{http_code}' -X POST --data-urlencode "_csrf=${csrf}" "${base_url}/demo-login/customer")"
          echo "Customer demo login HTTP: ${code}"
          grep -i '^location:' /tmp/demo-headers.txt || true
          if [[ "$code" == "302" || "$code" == "303" ]]; then
            echo 'Demo endpoint is active.'
          else
            echo 'Demo endpoint is not active.' >&2
          fi

          exit 0
