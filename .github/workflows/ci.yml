name: Build and test

on:
  push:
    branches: [ main, codex/premium-storefront ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven wrapper
        run: chmod +x mvnw

      - name: Run tests and package
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > maven.log 2>&1
          status=$?
          tail -n 200 maven.log
          exit "$status"

      - name: Upload Maven diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics
          path: maven.log
          if-no-files-found: error
          retention-days: 3

      - name: Verify buyer and admin operations in the packaged demo
        shell: bash
        run: |
          set -euo pipefail
          SPRING_PROFILES_ACTIVE=demo RENDER=true APP_KEEP_WARM_ENABLED=false \
            LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY_WEB_CSRF=DEBUG \
            java -jar target/jersey-see-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/jerseysee-runtime.log" 2>&1 &
          app_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then tail -n 100 "$RUNNER_TEMP/jerseysee-runtime.log"; fi; kill "$app_pid" 2>/dev/null || true' EXIT

          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/live-smoke.yml")
            workflow.fetch("jobs").fetch("smoke").fetch("steps").each { |step| puts step.fetch("run") }
          ' > "$RUNNER_TEMP/jerseysee-smoke.sh"

          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --max-time 3 http://127.0.0.1:8080/actuator/health >/dev/null
          npm install --no-save --package-lock=false --ignore-scripts playwright-core
          node <<'JS'
          const assert = require("node:assert/strict");
          const { chromium } = require("playwright-core");

          async function verifyProductEditor() {
              const base = "http://127.0.0.1:8080";
              const browser = await chromium.launch({ executablePath: "/usr/bin/google-chrome", args: ["--no-sandbox"] });
              try {
                  const page = await browser.newPage();
                  await page.goto(base + "/login");
                  await page.locator('input[name="username"]').fill("admin@demo.local");
                  await page.locator('input[name="password"]').fill("Demo123!");
                  await page.locator('form[action="/login"] button[type="submit"]').click();
                  await page.waitForURL("**/dashboard");
                  await page.goto(base + "/staff/products/new");

                  const form = page.locator("form.product-editor");
                  await form.locator("#name").fill("Browser-only temporary product");
                  await form.locator("#brand").fill("JerseySee");
                  await form.locator("#description").fill("Browser verification fixture");
                  await form.locator("#basePrice").fill("100");
                  await form.locator("#categoryId").selectOption({ index: 1 });
                  await form.locator("#productType").selectOption("ACCESSORY");
                  await form.locator('input[type="checkbox"][name="active"]').uncheck();
                  await form.locator('label:has(input[name="selectedKitImage"][value="barcelona-home"])').click();
                  await form.locator('button[type="submit"]').click();
                  await page.waitForURL(/\/staff\/products\/\d+\/edit\?created$/);
                  await page.locator("[data-image-preview]").evaluate(image => image.decode());

                  const action = await form.getAttribute("action");
                  await form.locator("#name").fill("Browser-only temporary product updated");
                  await form.locator("#image").setInputFiles("src/main/resources/static/images/kits/arsenal-home.jpg");
                  const [updated] = await Promise.all([
                      page.waitForResponse(response => response.request().method() === "POST"
                          && new URL(response.url()).pathname === action),
                      form.locator('button[type="submit"]').click()
                  ]);
                  if (updated.status() !== 302) {
                      const submitted = updated.request().postDataBuffer()?.toString("latin1") ?? "";
                      const sentCookies = (await updated.request().allHeaders()).cookie ?? "";
                      const pageText = await updated.text();
                      console.error("Upload diagnostics", JSON.stringify({
                          formHasCsrf: await form.locator('input[name="_csrf"]').count(),
                          submittedCsrf: /name="_csrf"\r\n\r\n[^\r\n]+/.test(submitted),
                          submittedImage: /name="image"; filename=/.test(submitted),
                          hasSessionCookie: /(?:^|; )JSESSIONID=/.test(sentCookies),
                          hasAccessCookie: /(?:^|; )JERSEYSEE_ACCESS=/.test(sentCookies),
                          formExpired: /form expired/i.test(pageText),
                          status: updated.status()
                      }));
                  }
                  assert.equal(updated.status(), 302, "Chrome product image upload response");
                  await page.waitForURL(/\/staff\/products\/\d+\/edit\?updated$/);
                  await page.locator("[data-image-preview]").evaluate(image => image.decode());
                  console.log("Chrome product creation, image preview, and file replacement passed.");
              } finally {
                  await browser.close();
              }
          }

          verifyProductEditor().catch(error => { console.error(error.message); process.exitCode = 1; });
          JS

          BASE_URL=http://127.0.0.1:8080 bash "$RUNNER_TEMP/jerseysee-smoke.sh"

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag jerseysee:ci .
