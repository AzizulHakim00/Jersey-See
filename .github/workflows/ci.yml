name: Build and test

on:
  push:
    branches: [ main, codex/premium-storefront ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven wrapper
        run: chmod +x mvnw

      - name: Run tests and package
        id: maven_verify
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify 2>&1 | tee maven-verify.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Maven verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-verify-log
          path: maven-verify.log
          if-no-files-found: error
          retention-days: 2

      - name: Fail when Maven verification failed
        if: steps.maven_verify.outputs.status != '0'
        run: exit 1

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag jerseysee:ci .
