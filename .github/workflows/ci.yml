name: Build and test

on:
  push:
    branches: [ main, codex/premium-storefront ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven wrapper
        run: chmod +x mvnw

      - name: Run tests and package
        shell: bash
        run: |
          set +e
          ./mvnw --batch-mode --no-transfer-progress clean verify > maven.log 2>&1
          status=$?
          tail -n 200 maven.log
          exit "$status"

      - name: Upload Maven diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maven-diagnostics
          path: maven.log
          if-no-files-found: error
          retention-days: 3

  docker:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build production container
        run: docker build --tag jerseysee:ci .

      - name: Verify buyer and admin operations in the built container
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name jerseysee-ci --publish 127.0.0.1:8080:8080 \
            --env SPRING_PROFILES_ACTIVE=demo --env RENDER=true \
            --env APP_KEEP_WARM_ENABLED=false jerseysee:ci
          trap 'status=$?; if [ "$status" -ne 0 ]; then docker logs jerseysee-ci; fi; docker rm -f jerseysee-ci >/dev/null' EXIT

          ruby -ryaml -e '
            workflow = YAML.load_file(".github/workflows/live-smoke.yml")
            workflow.fetch("jobs").fetch("smoke").fetch("steps").each { |step| puts step.fetch("run") }
          ' > "$RUNNER_TEMP/jerseysee-smoke.sh"

          BASE_URL=http://127.0.0.1:8080 bash "$RUNNER_TEMP/jerseysee-smoke.sh"
