name: Build and test

on:
  push:
    branches: [ main, codex/premium-storefront ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify Maven wrapper
        run: chmod +x mvnw

      - name: Run tests and package
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
