name: Live Render smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://jersey-see.onrender.com
    steps:
      - name: Verify the deployed homepage, login, and catalog
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() {
            local url="$1"
            local out="$2"
            local expected="${3:-}"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url" -o "$out" &&
                 { [ -z "$expected" ] || grep -Fq "$expected" "$out"; }; then
                return 0
              fi
              echo "Attempt ${attempt}/24 failed for ${url}; waiting 20s..."
              sleep 20
            done
            echo "Timed out waiting for ${url}" >&2
            return 1
          }

          retry_curl "$BASE_URL/actuator/health" health.json
          grep -Eq '"status"\s*:\s*"UP"' health.json
          retry_curl "$BASE_URL/actuator/info" release.json "$GITHUB_SHA"

          retry_curl "$BASE_URL/" home.html "data-hero-showcase"
          grep -Fq "/images/media/home-motion-strike.webp" home.html
          grep -Fq "/css/home-campaign.css" home.html
          test "$(grep -c 'data-hero-slide' home.html)" -ge 2
          retry_curl "$BASE_URL/css/home-campaign.css" home-campaign.css "hero-jersey-float"
          retry_curl "$BASE_URL/js/storefront-premium-v2.js" home-showcase.js "data-hero-showcase"
          retry_curl "$BASE_URL/css/fonts/barlow-condensed-800-italic.ttf" campaign-font.ttf
          test -s campaign-font.ttf
          grep -Fq "Wear The Passion" home.html
          grep -Fq "Shop by category" home.html

          retry_curl "$BASE_URL/login" login.html "/images/media/login-barcelona-kit.png"
          retry_curl "$BASE_URL/js/app.js?v=account-operations" account.js 'logoutModal?.querySelector("form") instanceof HTMLFormElement'
          expired_status="$(curl --silent --show-error --max-time 25 --request POST "$BASE_URL/login" \
            --output expired-form.html --write-out "%{http_code}")"
          test "$expired_status" = "403"
          grep -Fq "Form expired" expired-form.html
          grep -Fq "Sign in to JerseySee" login.html
          grep -Fq "Demo credentials (for testing only)" login.html

          retry_curl "$BASE_URL/dashboard" dashboard-guest.html
          grep -Fq "Sign in to JerseySee" dashboard-guest.html

          retry_curl "$BASE_URL/images/media/home-motion-strike.webp" hero.webp
          test -s hero.webp
          retry_curl "$BASE_URL/images/media/login-barcelona-kit.png" login-kit.png
          test -s login-kit.png
          retry_curl "$BASE_URL/catalog?productType=JERSEY&clubOrCountry=Barcelona" catalog-kits.html "Barcelona Home Fan Jersey"
          retry_curl "$BASE_URL/product-images/demo-barcelona-home-fan-supplied.jpg" barcelona-home.jpg
          test -s barcelona-home.jpg

      - name: Verify live sign-in and persistent cart
        shell: bash
        run: |
          set -Eeuo pipefail
          checkpoint="read login forms"
          trap 'echo "::error::Live operation failed at line $LINENO ($checkpoint)"' ERR
          extract_csrf() {
            python3 - "$1" "${2:-}" <<'PY'
          from html.parser import HTMLParser
          import sys

          class CsrfParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.value = ""
                  self.action = ""

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "form":
                      self.action = values.get("action", "")
                  if tag == "input" and values.get("name") == "_csrf":
                      if not sys.argv[2] or self.action == sys.argv[2]:
                          self.value = values.get("value", "")

              def handle_endtag(self, tag):
                  if tag == "form":
                      self.action = ""

          parser = CsrfParser()
          with open(sys.argv[1], encoding="utf-8") as source:
              parser.feed(source.read())
          print(parser.value)
          PY
          }

          browser_request() {
            local jar="$1"
            shift
            curl --silent --show-error --connect-timeout 10 --max-time 30 \
              --cookie "$jar" --cookie-jar "$jar" "$@"
          }

          get_page_status() {
            local jar="$1" path="$2" output="$3"
            local status
            status="$(browser_request "$jar" --output "$output" --write-out "%{http_code}" "$BASE_URL$path")"
            printf "GET %s returned HTTP %s\n" "$path" "$status" >&2
            printf "%s" "$status"
          }

          assert_signed_out() {
            local jar="$1" prefix="$2"
            local status
            status="$(browser_request "$jar" --output /dev/null --dump-header "${prefix}-signed-out.headers" \
              --write-out "%{http_code}" "$BASE_URL/dashboard")"
            test "$status" = "302"
            grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/login[[:space:]]*$' "${prefix}-signed-out.headers"
          }

          # Verify the browser form and cookies with the actual demo administrator.
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie-jar admin.cookies \
            "$BASE_URL/login" -o admin-login.html

          csrf="$(extract_csrf admin-login.html)"
          test -n "$csrf"

          login_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --cookie admin.cookies --cookie-jar admin.cookies \
            --request POST "$BASE_URL/login" \
            --data-urlencode "username=admin@demo.local" \
            --data-urlencode "password=Demo123!" \
            --data-urlencode "_csrf=$csrf" \
            --dump-header admin-login.headers \
            --output admin-login-response.html \
            --write-out "%{http_code}")"

          if [ "$login_status" != "302" ]; then
            echo "Admin login returned HTTP $login_status instead of 302" >&2
            exit 1
          fi
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/dashboard([?#][^[:space:]]*)?[[:space:]]*$' admin-login.headers

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie admin.cookies --cookie-jar admin.cookies \
            "$BASE_URL/dashboard" -o admin-dashboard.html
          grep -Fq "Admin dashboard" admin-dashboard.html
          grep -Fq "STORE OPERATIONS" admin-dashboard.html

          for route in /staff/products /staff/orders /staff/payments /staff/employees /profile; do
            staff_status="$(get_page_status admin.cookies "$route" staff-page.html)"
            if [ "$staff_status" != "200" ]; then
              echo "Admin page $route returned HTTP $staff_status instead of 200" >&2
              exit 1
            fi
          done

          test "$(get_page_status admin.cookies /staff/products/new admin-product-form.html)" = "200"
          checkpoint="admin opens product editor and supplied kit images"
          product_csrf="$(extract_csrf admin-product-form.html /staff/products)"
          grep -Eo '/images/kits/[a-z0-9-]+\.jpg' admin-product-form.html | sort -u > supplied-kits.txt
          test "$(wc -l < supplied-kits.txt)" -eq 22
          mkdir -p supplied-kits
          while IFS= read -r asset; do
            curl --fail --silent --show-error --max-time 20 "$BASE_URL$asset" -o "supplied-kits/${asset##*/}"
            test -s "supplied-kits/${asset##*/}"
          done < supplied-kits.txt
          test -n "$product_csrf"
          category_id="$(python3 - <<'PY'
          import re
          from pathlib import Path

          markup = Path("admin-product-form.html").read_text(encoding="utf-8")
          select = re.search(r'<select\b[^>]*\bname="categoryId"[^>]*>(.*?)</select>', markup, re.S)
          assert select, "Product form category selector missing"
          option = re.search(r'<option\b[^>]*\bvalue="(\d+)"', select[1])
          assert option, "No product category available"
          print(option[1])
          PY
          )"

          smoke_product_name="Private smoke product $GITHUB_RUN_ID"
          product_fields=(--form-string "categoryId=$category_id"
            --form-string "description=Temporary inactive release verification fixture"
            --form-string "brand=JerseySee" --form-string "productType=ACCESSORY"
            --form-string "basePrice=100" --form-string "active=false")

          submit_product() {
            local route="$1" token="$2" name="$3" prefix="$4"
            shift 4
            browser_request admin.cookies --request POST "$BASE_URL$route" \
              --form-string "_csrf=$token" --form-string "name=$name" "${product_fields[@]}" "$@" \
              --output "${prefix}.html" --dump-header "${prefix}.headers" --write-out "%{http_code}"
          }

          checkpoint="admin creates product with a supplied kit image"
          create_status="$(submit_product /staff/products "$product_csrf" "$smoke_product_name" admin-create \
            --form-string "selectedKitImage=barcelona-home")"
          if [ "$create_status" != "302" ]; then
            echo "Admin multipart product creation returned HTTP $create_status instead of 302" >&2
            exit 1
          fi
          smoke_product_id="$(tr -d '\r' < admin-create.headers | sed -nE 's@^[Ll]ocation: *(https?://[^/]+)?/staff/products/([0-9]+)/edit\?created$@\2@p')"
          test -n "$smoke_product_id"

          cleanup_admin_product() {
            local csrf status
            test "$(get_page_status admin.cookies "/staff/products/$smoke_product_id/edit" admin-cleanup.html)" = "200" || return 1
            csrf="$(extract_csrf admin-cleanup.html)"
            test -n "$csrf" || return 1
            status="$(browser_request admin.cookies --request POST "$BASE_URL/staff/products/$smoke_product_id/delete" \
              --data-urlencode "_csrf=$csrf" --output /dev/null --write-out "%{http_code}")"
            test "$status" = "302"
          }
          trap cleanup_admin_product EXIT

          test "$(get_page_status admin.cookies "/staff/products/$smoke_product_id/edit" admin-product-edit.html)" = "200"
          grep -Fq "$smoke_product_name" admin-product-edit.html
          preview_path="/staff/products/$smoke_product_id/image"
          test "$(get_page_status admin.cookies "$preview_path" admin-selected-kit.jpg)" = "200"
          cmp supplied-kits/barcelona-home.jpg admin-selected-kit.jpg
          product_action="/staff/products/$smoke_product_id"
          product_csrf="$(extract_csrf admin-product-edit.html "$product_action")"
          test -n "$product_csrf"
          checkpoint="admin replaces product image with a file upload"
          update_status="$(submit_product "$product_action" "$product_csrf" "$smoke_product_name updated" admin-update \
            --form "image=@supplied-kits/arsenal-home.jpg;type=image/jpeg")"
          if [ "$update_status" != "302" ]; then
            echo "Admin image replacement returned HTTP $update_status instead of 302." >&2
            exit 1
          fi
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/staff/products/[0-9]+/edit\?updated[[:space:]]*$' admin-update.headers

          test "$(get_page_status admin.cookies "/staff/products/$smoke_product_id/edit" admin-variant.html)" = "200"
          grep -Fq "$smoke_product_name updated" admin-variant.html
          test "$(get_page_status admin.cookies "$preview_path" admin-replaced-kit.jpg)" = "200"
          cmp supplied-kits/arsenal-home.jpg admin-replaced-kit.jpg
          test "$(get_page_status admin.cookies "/products/$smoke_product_id/image/download" admin-download-kit.jpg)" = "200"
          cmp admin-replaced-kit.jpg admin-download-kit.jpg
          checkpoint="admin creates inventory variant"
          variant_csrf="$(extract_csrf admin-variant.html)"
          test -n "$variant_csrf"
          variant_status="$(browser_request admin.cookies --request POST "$BASE_URL/staff/products/$smoke_product_id/variants" \
            --data-urlencode "_csrf=$variant_csrf" --data-urlencode "size=ONE_SIZE" \
            --data-urlencode "sku=SMOKE-$GITHUB_RUN_ID" --data-urlencode "stockQuantity=0" \
            --data-urlencode "priceAdjustment=0" --output /dev/null \
            --dump-header admin-variant-save.headers --write-out "%{http_code}")"
          test "$variant_status" = "302"
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/staff/products/[0-9]+/edit\?variantCreated[[:space:]]*$' admin-variant-save.headers
          cleanup_admin_product
          trap - EXIT

          test "$(get_page_status admin.cookies /dashboard admin-before-logout.html)" = "200"
          admin_logout_csrf="$(extract_csrf admin-before-logout.html)"
          test -n "$admin_logout_csrf"
          admin_logout_status="$(browser_request admin.cookies --request POST "$BASE_URL/logout" \
            --data-urlencode "_csrf=$admin_logout_csrf" --output /dev/null \
            --dump-header admin-logout.headers --write-out "%{http_code}")"
          test "$admin_logout_status" = "302"
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/login\?logout[[:space:]]*$' admin-logout.headers
          assert_signed_out admin.cookies admin

          test "$(get_page_status admin.cookies '/login?logout' admin-relogin.html)" = "200"
          admin_relogin_csrf="$(extract_csrf admin-relogin.html)"
          test -n "$admin_relogin_csrf"
          admin_relogin_status="$(browser_request admin.cookies --request POST "$BASE_URL/login" \
            --data-urlencode "username=admin@demo.local" --data-urlencode "password=Demo123!" \
            --data-urlencode "_csrf=$admin_relogin_csrf" --output /dev/null \
            --dump-header admin-relogin.headers --write-out "%{http_code}")"
          test "$admin_relogin_status" = "302"
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/dashboard[[:space:]]*$' admin-relogin.headers
          test "$(get_page_status admin.cookies /dashboard admin-after-relogin.html)" = "200"
          grep -Fq "Admin dashboard" admin-after-relogin.html
          echo "Admin sign-in, staff pages, kit image selection, product creation, image upload and replacement, inventory, cleanup, logout, and re-login passed."

          # PERSISTENT_CART_SMOKE uses the demo customer only. It creates one
          # uniquely marked cart line, verifies that line after a completely
          # fresh login session, then removes only that line. It never checks out.
          PERSISTENT_CART_SMOKE="PERSISTENT SMOKE"

          login_customer() {
            local cookie_jar="$1"
            local prefix="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
              "$BASE_URL/login" -o "${prefix}-login.html"

            local customer_csrf
            customer_csrf="$(extract_csrf "${prefix}-login.html")"
            test -n "$customer_csrf"

            local customer_login_status
            customer_login_status="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
              --request POST "$BASE_URL/login" \
              --data-urlencode "username=customer@demo.local" \
              --data-urlencode "password=Demo123!" \
              --data-urlencode "_csrf=$customer_csrf" \
              --dump-header "${prefix}-login.headers" \
              --output "${prefix}-login-response.html" \
              --write-out "%{http_code}")"

            if [ "$customer_login_status" != "302" ]; then
              echo "Customer login returned HTTP $customer_login_status instead of 302" >&2
              exit 1
            fi
            grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/dashboard([?#][^[:space:]]*)?[[:space:]]*$' "${prefix}-login.headers"
          }

          find_smoke_line_id() {
            python3 - "$1" "$PERSISTENT_CART_SMOKE" <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              html = source.read()
          marker = sys.argv[2]
          for article in re.findall(r'<article\b[^>]*class="[^"]*cart-line[^"]*"[^>]*>.*?</article>', html, re.S):
              if marker not in article:
                  continue
              match = re.search(r'action="/cart/items/([^"/]+)/remove"', article)
              if match:
                  print(match.group(1))
                  break
          PY
          }

          remove_smoke_line_if_present() {
            local cookie_jar="$1"
            local cart_file="$2"
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
              "$BASE_URL/cart" -o "$cart_file"

            local stale_line_id
            stale_line_id="$(find_smoke_line_id "$cart_file")"
            if [ -z "$stale_line_id" ]; then
              return 0
            fi

            local remove_csrf
            remove_csrf="$(extract_csrf "$cart_file")"
            test -n "$remove_csrf"
            local remove_status
            remove_status="$(curl --silent --show-error \
              --connect-timeout 10 --max-time 30 \
              --cookie "$cookie_jar" --cookie-jar "$cookie_jar" \
              --request POST "$BASE_URL/cart/items/$stale_line_id/remove" \
              --data-urlencode "_csrf=$remove_csrf" \
              --dump-header stale-remove.headers \
              --output stale-remove.html \
              --write-out "%{http_code}")"
            if [ "$remove_status" != "302" ]; then
              echo "Could not remove stale persistent-cart smoke line (HTTP $remove_status)" >&2
              exit 1
            fi
          }

          checkpoint="buyer sign-in"
          login_customer customer.cookies customer
          checkpoint="buyer dashboard"
          test "$(get_page_status customer.cookies /dashboard buyer-dashboard.html)" = "200"
          checkpoint="buyer profile"
          test "$(get_page_status customer.cookies /profile buyer-profile.html)" = "200"
          checkpoint="buyer saves profile"
          profile_csrf="$(extract_csrf buyer-profile.html /profile)"
          test -n "$profile_csrf"
          mapfile -d '' -t profile_fields < <(python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class ProfileParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.fields = {}
                  self.in_address = False

              def handle_starttag(self, tag, attributes):
                  attrs = dict(attributes)
                  field = attrs.get("name")
                  if tag == "input" and field in {"name", "phone"}:
                      self.fields[field] = attrs.get("value", "")
                  if tag == "textarea" and field == "address":
                      self.in_address = True
                      self.fields[field] = ""

              def handle_data(self, data):
                  if self.in_address:
                      self.fields["address"] += data

              def handle_endtag(self, tag):
                  if tag == "textarea":
                      self.in_address = False

          parser = ProfileParser()
          parser.feed(Path("buyer-profile.html").read_text(encoding="utf-8"))
          for field in ("name", "phone", "address"):
              sys.stdout.write(field + "=" + parser.fields[field] + "\0")
          PY
          )
          test "${#profile_fields[@]}" -eq 3
          profile_status="$(browser_request customer.cookies --request POST "$BASE_URL/profile" \
            --data-urlencode "_csrf=$profile_csrf" --data-urlencode "${profile_fields[0]}" \
            --data-urlencode "${profile_fields[1]}" --data-urlencode "${profile_fields[2]}" \
            --output /dev/null --dump-header buyer-profile-save.headers --write-out "%{http_code}")"
          test "$profile_status" = "302"
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/profile\?updated[[:space:]]*$' buyer-profile-save.headers
          checkpoint="buyer order history"
          test "$(get_page_status customer.cookies /orders buyer-orders.html)" = "200"
          checkpoint="buyer blocked from admin pages"
          test "$(get_page_status customer.cookies /staff/products buyer-forbidden.html)" = "403"
          checkpoint="buyer opens cart"
          remove_smoke_line_if_present customer.cookies customer-cart-initial.html

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie customer.cookies --cookie-jar customer.cookies \
            "$BASE_URL/catalog" -o customer-catalog.html

          checkpoint="find a product in the catalog"
          product_path="$(python3 - <<'PY'
          from html.parser import HTMLParser

          class ProductParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.path = ""

              def handle_starttag(self, tag, attrs):
                  if self.path or tag != "a":
                      return
                  href = dict(attrs).get("href", "")
                  if href.startswith("/products/") and href[len("/products/"):].isdigit():
                      self.path = href

          parser = ProductParser()
          with open("customer-catalog.html", encoding="utf-8") as source:
              parser.feed(source.read())
          print(parser.path)
          PY
          )"
          test -n "$product_path"

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie customer.cookies --cookie-jar customer.cookies \
            "$BASE_URL$product_path" -o customer-product.html

          checkpoint="find an in-stock product variant"
          variant_id="$(python3 - <<'PY'
          from html.parser import HTMLParser

          class VariantParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.value = ""

              def handle_starttag(self, tag, attrs):
                  if self.value or tag != "option":
                      return
                  values = dict(attrs)
                  candidate = values.get("value", "")
                  if candidate.isdigit() and "disabled" not in values:
                      self.value = candidate

          parser = VariantParser()
          with open("customer-product.html", encoding="utf-8") as source:
              parser.feed(source.read())
          print(parser.value)
          PY
          )"
          test -n "$variant_id"

          checkpoint="buyer adds a cart line"
          customer_csrf="$(extract_csrf customer-product.html)"
          test -n "$customer_csrf"
          add_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --cookie customer.cookies --cookie-jar customer.cookies \
            --request POST "$BASE_URL/cart/items" \
            --data-urlencode "variantId=$variant_id" \
            --data-urlencode "quantity=1" \
            --data-urlencode "printingType=CUSTOM" \
            --data-urlencode "printingName=$PERSISTENT_CART_SMOKE" \
            --data-urlencode "printingNumber=88" \
            --data-urlencode "_csrf=$customer_csrf" \
            --dump-header customer-add.headers \
            --output customer-add.html \
            --write-out "%{http_code}")"
          if [ "$add_status" != "302" ]; then
            echo "Persistent-cart smoke add returned HTTP $add_status instead of 302" >&2
            exit 1
          fi
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/cart\?added[[:space:]]*$' customer-add.headers

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie customer.cookies --cookie-jar customer.cookies \
            "$BASE_URL/cart" -o cart-before-logout.html
          checkpoint="buyer cart contains the added product"
          line_id_before="$(find_smoke_line_id cart-before-logout.html)"
          test -n "$line_id_before"

          checkpoint="buyer checkout page"
          cp customer.cookies cart-before-checkout.cookies
          test "$(get_page_status customer.cookies /checkout checkout-page.html)" = "200"
          grep -Fq "data-checkout-layout" checkout-page.html

          checkpoint="buyer changes cart quantity"
          test "$(get_page_status customer.cookies /cart cart-for-quantity.html)" = "200"
          quantity_action="/cart/items/$line_id_before"
          quantity_csrf="$(extract_csrf cart-for-quantity.html "$quantity_action")"
          test -n "$quantity_csrf"
          python3 - "$quantity_csrf" <<'PY'
          import base64
          from pathlib import Path
          import sys

          def csrf_cookie(path):
              for line in Path(path).read_text().splitlines():
                  fields = line.split("\t")
                  if len(fields) == 7 and fields[5] == "XSRF-TOKEN":
                      return fields[6]
              return ""

          current = csrf_cookie("customer.cookies")
          encoded = sys.argv[1]
          decoded = base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4))
          half = len(decoded) // 2
          raw = bytes(left ^ right for left, right in zip(decoded[:half], decoded[half:]))
          print(f"Cart CSRF cookie persisted through checkout: {bool(current) and current == csrf_cookie('cart-before-checkout.cookies')}")
          print(f"Quantity form token matches current CSRF cookie: {raw == current.encode()}")
          PY
          quantity_status="$(browser_request customer.cookies --request POST "$BASE_URL/cart/items/$line_id_before" \
            --data-urlencode "_csrf=$quantity_csrf" --data-urlencode "quantity=2" \
            --output customer-quantity.html --dump-header customer-quantity.headers --write-out "%{http_code}")"
          if [ "$quantity_status" != "302" ]; then
            echo "Cart quantity update returned HTTP $quantity_status instead of 302." >&2
            grep -Eo 'Form expired|Quantity must be between 1 and 10 per cart line\.|Cart line not found\.|[Ii]nsufficient stock|[Oo]nly [0-9]+ in stock|Whitelabel Error Page|Internal Server Error' customer-quantity.html | sort -u || true
            exit 1
          fi
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/cart\?updated[[:space:]]*$' customer-quantity.headers
          test "$(get_page_status customer.cookies /cart cart-before-logout.html)" = "200"

          checkpoint="buyer signs out"
          logout_csrf="$(extract_csrf cart-before-logout.html /logout)"
          test -n "$logout_csrf"
          logout_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --cookie customer.cookies --cookie-jar customer.cookies \
            --request POST "$BASE_URL/logout" \
            --data-urlencode "_csrf=$logout_csrf" \
            --dump-header customer-logout.headers \
            --output customer-logout.html \
            --write-out "%{http_code}")"
          if [ "$logout_status" != "302" ]; then
            echo "Customer logout returned HTTP $logout_status instead of 302" >&2
            exit 1
          fi

          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/login\?logout[[:space:]]*$' customer-logout.headers
          assert_signed_out customer.cookies customer
          cp customer.cookies fresh-customer.cookies
          checkpoint="buyer signs back in"
          login_customer fresh-customer.cookies fresh-customer
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie fresh-customer.cookies --cookie-jar fresh-customer.cookies \
            "$BASE_URL/cart" -o cart-after-login.html

          checkpoint="buyer cart persists after sign-in"
          line_id_after="$(find_smoke_line_id cart-after-login.html)"
          if [ -z "$line_id_after" ]; then
            echo "persisted cart line missing after fresh login" >&2
            exit 1
          fi
          if [ "$line_id_before" != "$line_id_after" ]; then
            echo "persisted cart line changed identity after fresh login" >&2
            exit 1
          fi

          checkpoint="buyer removes the cart line"
          cleanup_csrf="$(extract_csrf cart-after-login.html "/cart/items/$line_id_after/remove")"
          test -n "$cleanup_csrf"
          cleanup_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --cookie fresh-customer.cookies --cookie-jar fresh-customer.cookies \
            --request POST "$BASE_URL/cart/items/$line_id_after/remove" \
            --data-urlencode "_csrf=$cleanup_csrf" \
            --dump-header customer-remove.headers \
            --output customer-remove.html \
            --write-out "%{http_code}")"
          if [ "$cleanup_status" != "302" ]; then
            echo "Persistent-cart smoke cleanup returned HTTP $cleanup_status instead of 302" >&2
            exit 1
          fi
          grep -Eiq '^location:[[:space:]]*(https?://[^/]+)?/cart\?removed[[:space:]]*$' customer-remove.headers

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie fresh-customer.cookies --cookie-jar fresh-customer.cookies \
            "$BASE_URL/cart" -o customer-cart-cleaned.html
          if [ -n "$(find_smoke_line_id customer-cart-cleaned.html)" ]; then
            echo "Persistent-cart smoke line remained after cleanup" >&2
            exit 1
          fi
          echo "Buyer dashboard, profile, orders, cart, checkout page, role boundaries, logout, and re-login passed."
