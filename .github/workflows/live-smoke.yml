name: Live Render smoke test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://jersey-see.onrender.com
    steps:
      - name: Wait for Render and verify live storefront
        shell: bash
        run: |
          set -euo pipefail
          retry_curl() {
            local url="$1"
            local out="$2"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 "$url" -o "$out"; then
                return 0
              fi
              echo "Attempt ${attempt}/24 failed for ${url}; waiting 20s..."
              sleep 20
            done
            echo "Timed out waiting for ${url}" >&2
            return 1
          }

          retry_curl "$BASE_URL/actuator/health" health.json
          grep -Eq '"status"\s*:\s*"UP"' health.json

          retry_curl "$BASE_URL/" home.html
          grep -Fq "Wear The Passion" home.html
          grep -Fq "/images/media/home-hero.webp" home.html
          grep -Fq "Shop by category" home.html

          retry_curl "$BASE_URL/login" login.html
          grep -Fq "Sign in to JerseySee" login.html
          grep -Fq "/images/media/login-player.webp" login.html
          grep -Fq "Demo credentials (for testing only)" login.html

          retry_curl "$BASE_URL/dashboard" dashboard-guest.html
          grep -Fq "Sign in to JerseySee" dashboard-guest.html

          retry_curl "$BASE_URL/images/media/home-hero.webp" hero.webp
          test -s hero.webp
          retry_curl "$BASE_URL/images/media/login-player.webp" login-player.webp
          test -s login-player.webp

          # Exercise the exact admin form-login path that previously failed on
          # the first POST after a lazily initialized production startup.
          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie-jar admin.cookies \
            "$BASE_URL/login" -o admin-login.html

          csrf="$(python3 - <<'PY'
          from html.parser import HTMLParser

          class CsrfParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.value = ""

              def handle_starttag(self, tag, attrs):
                  if tag != "input":
                      return
                  values = dict(attrs)
                  if values.get("name") == "_csrf":
                      self.value = values.get("value", "")

          parser = CsrfParser()
          with open("admin-login.html", encoding="utf-8") as source:
              parser.feed(source.read())
          print(parser.value)
          PY
          )"
          test -n "$csrf"

          login_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --cookie admin.cookies --cookie-jar admin.cookies \
            --request POST "$BASE_URL/login" \
            --data-urlencode "username=admin@demo.local" \
            --data-urlencode "password=Demo123!" \
            --data-urlencode "_csrf=$csrf" \
            --dump-header admin-login.headers \
            --output admin-login-response.html \
            --write-out "%{http_code}")"

          if [ "$login_status" != "302" ]; then
            echo "Admin login returned HTTP $login_status instead of 302" >&2
            cat admin-login.headers >&2 || true
            exit 1
          fi
          grep -Eiq '^location:[[:space:]]*/dashboard([[:space:]]|$)' admin-login.headers

          curl --fail --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --cookie admin.cookies \
            "$BASE_URL/dashboard" -o admin-dashboard.html
          grep -Fq "Admin dashboard" admin-dashboard.html
          grep -Fq "STORE OPERATIONS" admin-dashboard.html
