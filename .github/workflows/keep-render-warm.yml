name: Keep Render warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/keep-render-warm.yml

permissions:
  contents: read

concurrency:
  group: keep-render-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent "JerseySee-GitHub-KeepWarm/1.0" \
            https://jersey-see.onrender.com/actuator/health \
            -o health.json
          grep -Eq '"status"\s*:\s*"UP"' health.json
