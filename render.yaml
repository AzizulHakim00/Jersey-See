services:
  - type: web
    name: jersey-see
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JERSEYSEE_DB_URL
        sync: false
      - key: JERSEYSEE_DB_USERNAME
        sync: false
      - key: JERSEYSEE_DB_PASSWORD
        sync: false
      - key: JERSEYSEE_DEMO_CATALOG_ENABLED
        value: "false"
      - key: JERSEYSEE_PUBLIC_DEMO_ENABLED
        value: "true"
      - key: APP_SEED_ADMIN_ENABLED
        value: "true"
      - key: APP_SEED_ADMIN_EMAIL
        sync: false
      - key: APP_SEED_ADMIN_PASSWORD
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
